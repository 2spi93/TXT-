<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1724"/>
      <stop offset="1" stop-color="#101E31"/>
    </linearGradient>
    <linearGradient id="accent" x1="180" y1="180" x2="1020" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69A9FF"/>
      <stop offset="1" stop-color="#6EF2C3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1020" cy="132" r="180" fill="#69A9FF" fill-opacity="0.09"/>
  <circle cx="146" cy="744" r="180" fill="#6EF2C3" fill-opacity="0.08"/>
  <text x="84" y="116" fill="#CBFFF1" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">POURQUOI ÇA MARCHE</text>
  <text x="84" y="182" fill="#F3F7FC" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800">Organisateur sous évier coulissant 2 niveaux</text>
  <text x="84" y="228" fill="#9FB0C4" font-family="Inter, Arial, sans-serif" font-size="26">Le bénéfice se comprend vite : plus de place, plus d’accès, moins de désordre.</text>

  <rect x="84" y="288" width="420" height="520" rx="28" fill="#132235" stroke="rgba(255,255,255,0.08)"/>
  <rect x="126" y="354" width="336" height="330" rx="26" fill="#0C1724" stroke="url(#accent)" stroke-width="4"/>
  <rect x="164" y="388" width="262" height="88" rx="22" fill="#182B41"/>
  <rect x="164" y="506" width="262" height="130" rx="22" fill="#182B41"/>
  <rect x="174" y="650" width="242" height="14" rx="7" fill="#69A9FF" fill-opacity="0.55"/>
  <circle cx="212" cy="432" r="20" fill="#6EF2C3" fill-opacity="0.92"/>
  <rect x="246" y="414" width="126" height="18" rx="9" fill="#F3F7FC" fill-opacity="0.92"/>
  <rect x="246" y="446" width="102" height="12" rx="6" fill="#9FB0C4" fill-opacity="0.8"/>
  <circle cx="212" cy="556" r="20" fill="#69A9FF" fill-opacity="0.92"/>
  <rect x="246" y="536" width="130" height="18" rx="9" fill="#F3F7FC" fill-opacity="0.92"/>
  <rect x="246" y="568" width="142" height="12" rx="6" fill="#9FB0C4" fill-opacity="0.8"/>
  <rect x="246" y="594" width="116" height="12" rx="6" fill="#9FB0C4" fill-opacity="0.6"/>

  <g>
    <rect x="560" y="302" width="560" height="138" rx="28" fill="#132235" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="628" cy="371" r="34" fill="#69A9FF"/>
    <text x="612" y="381" fill="#081018" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">1</text>
    <text x="690" y="362" fill="#F3F7FC" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Gain de place immédiat</text>
    <text x="690" y="404" fill="#9FB0C4" font-family="Inter, Arial, sans-serif" font-size="24">Deux niveaux exploitent enfin la hauteur perdue sous l’évier.</text>
  </g>
  <g>
    <rect x="560" y="476" width="560" height="138" rx="28" fill="#132235" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="628" cy="545" r="34" fill="#6EF2C3"/>
    <text x="610" y="555" fill="#081018" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">2</text>
    <text x="690" y="536" fill="#F3F7FC" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Accès rapide aux produits</text>
    <text x="690" y="578" fill="#9FB0C4" font-family="Inter, Arial, sans-serif" font-size="24">Les bacs coulissent pour attraper sprays, éponges et flacons sans fouiller.</text>
  </g>
  <g>
    <rect x="560" y="650" width="560" height="138" rx="28" fill="#132235" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="628" cy="719" r="34" fill="#FFD56F"/>
    <text x="610" y="729" fill="#081018" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">3</text>
    <text x="690" y="710" fill="#F3F7FC" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Zone plus propre et lisible</text>
    <text x="690" y="752" fill="#9FB0C4" font-family="Inter, Arial, sans-serif" font-size="24">Le rangement vertical évite l’empilement désordonné au fond du meuble.</text>
  </g>
</svg>