# =============================================================================
# Project: mwc  (mwc.gtixt.com)
# -----------------------------------------------------------------------------
# This file is the TEMPLATE / REFERENCE for any new project served by the
# shared mission-control-tls Nginx container. Rules:
#   - One file per project (do NOT mix projects in the same conf file).
#   - One server_name per project (no wildcard `_`, no foreign hostnames).
#   - One dedicated certificate under /etc/letsencrypt/live/<host>/.
#   - One dedicated upstream variable; never proxy to another project's
#     backend by accident.
#
# To clone for a new project <foo>.gtixt.com:
#   1. cp docker/mwc-tls.conf docker/<foo>-tls.conf
#   2. Replace every occurrence of "mwc" / "mwc.gtixt.com" / "MWC_TLS".
#   3. Mount it in docker-compose.yml under the mission-control-tls service:
#        - ./docker/<foo>-tls.conf:/etc/nginx/conf.d/<foo>.conf:ro
#   4. Issue cert: DOMAIN=<foo>.gtixt.com CERT_NAME=<foo>.gtixt.com \
#                   bash scripts/issue_tls_cert.sh
#   5. docker exec mission-control-tls nginx -t && nginx -s reload
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name mwc.gtixt.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Force HTTPS for the real app traffic.
    location / {
        return 308 https://mwc.gtixt.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mwc.gtixt.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Dedicated certificate, NOT shared with mission-control or any other project.
    ssl_certificate /etc/letsencrypt/live/mwc.gtixt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mwc.gtixt.com/privkey.pem;
    ssl_session_cache shared:MWC_TLS:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Dedicated static landing for MWC only.
    set $mwc_upstream http://mwc-landing:80;

    location / {
        proxy_pass $mwc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
