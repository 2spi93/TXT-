# =============================================================================
# Project: txt bridge  (bridge.txt.gtixt.com)
# -----------------------------------------------------------------------------
# Dedicated shared-ingress config for the TXT MT5 bridge API.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name bridge.txt.gtixt.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://bridge.txt.gtixt.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bridge.txt.gtixt.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    ssl_certificate /etc/letsencrypt/live/bridge.txt.gtixt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.txt.gtixt.com/privkey.pem;
    ssl_session_cache shared:TXT_BRIDGE_TLS:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    set $txt_bridge_upstream http://mt5-bridge:8006;

    location / {
        proxy_pass $txt_bridge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
