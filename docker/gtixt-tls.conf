# =============================================================================
# Project: gtixt
# Hostnames: gtixt.com, admin.gtixt.com, data.gtixt.com
# Backend  : gtixt-app:3000  (single Next.js app, host-based routing internal)
#
# Isolation rules (see docs/repo memory):
#   - This file is the ONLY place gtixt hostnames may appear in nginx conf.
#   - Dedicated cert directory /etc/letsencrypt/live/gtixt.com/ (multi-SAN).
#   - Backend reachable only via the `gtixt-net` external Docker network the
#     mission-control-tls container is attached to. Never proxy to a foreign
#     project's container.
# =============================================================================

# ---- HTTP :80 (ACME + redirect to HTTPS) -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name gtixt.com www.gtixt.com admin.gtixt.com data.gtixt.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# ---- HTTPS :443 ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gtixt.com admin.gtixt.com data.gtixt.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # www -> apex redirect handled in dedicated server block below.

    resolver_timeout 5s;

    # Dedicated certificate, multi-SAN for the gtixt project ONLY.
    ssl_certificate /etc/letsencrypt/live/gtixt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtixt.com/privkey.pem;
    ssl_session_cache shared:GTIXT_TLS:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Generous body size for admin uploads; tighten if not needed.
    client_max_body_size 32m;

    set $gtixt_upstream http://gtixt-app:3000;

    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        proxy_pass $gtixt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # If gtixt-app is down (during deploys / before first build) return
        # an explicit 503 instead of a generic 502 so it can never be confused
        # with a mission-control failure.
        proxy_intercept_errors on;
        error_page 502 503 504 = @gtixt_unavailable;
    }

    location @gtixt_unavailable {
        default_type text/plain;
        return 503 "gtixt: backend (gtixt-app:3000) not reachable\n";
    }
}

# ---- HTTPS :443 — www.gtixt.com canonical redirect to apex -----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gtixt.com;
    ssl_certificate /etc/letsencrypt/live/gtixt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtixt.com/privkey.pem;
    return 308 https://gtixt.com$request_uri;
}
