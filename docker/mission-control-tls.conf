map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Default catch-all on :80 — rejects unknown hosts so they NEVER leak into
# mission-control. Each project must declare its own server block below.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # Container healthcheck (wget -qO- http://127.0.0.1/healthz, no Host header).
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
    # Still allow ACME http-01 challenges for any host pointing here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / {
        return 444;
    }
}

# ---------------------------------------------------------------------------
# Project: mission-control  (app.txt.gtixt.com / txt.gtixt.com)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.txt.gtixt.com txt.gtixt.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $gateway_upstream http://mission-control-gateway:3000;

    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    if ($host = txt.gtixt.com) {
        return 308 https://app.txt.gtixt.com$request_uri;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

