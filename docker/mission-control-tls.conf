# Default catch-all on :443 — rejects unknown TLS SNIs so they NEVER leak
# into mission-control. Uses the app cert just to terminate the handshake.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/app.txt.gtixt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.txt.gtixt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

